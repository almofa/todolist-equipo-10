<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Cambiar Contraseña')"></head>
<body class="bg-light">

<nav th:replace="fragments :: menu"></nav>

<div class="container py-4">
    <div class="mb-3">
        <a th:href="@{/cuenta}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Volver a la cuenta
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0 mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border rounded-3 bg-white">
        <div class="card-header bg-white py-3 px-4 border-bottom">
            <h5 class="fw-bold mb-0 text-dark">
                <i class="bi bi-key me-2 text-primary"></i>Cambiar Contraseña
            </h5>
        </div>
        <div class="card-body p-4">
            <form action="#" th:action="@{/cuenta/password}" method="post">

                <div class="mb-3">
                    <label for="passwordActual" class="form-label fw-bold text-secondary">Contraseña Actual</label>
                    <input type="password" id="passwordActual" name="passwordActual" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label for="passwordNueva" class="form-label fw-bold text-secondary">Nueva Contraseña</label>
                    <input type="password" id="passwordNueva" name="passwordNueva" class="form-control" required />
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Actualizar Contraseña
                    </button>
                    <a href="/cuenta" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
