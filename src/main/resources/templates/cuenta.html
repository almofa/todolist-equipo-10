<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Mi Cuenta')"></head>
<body class="bg-light">

<nav th:replace="fragments :: menu"></nav>

<div class="container py-4">
    <!-- Botón para regresar al inicio -->
    <div class="mb-3">
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Volver al inicio
        </a>
    </div>

    <!-- Mensaje Flash de éxito -->
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show shadow-sm border-0 mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Tarjeta de Información de la Cuenta -->
    <div class="card shadow-sm border rounded-3 mb-4 bg-white">
        <div class="card-header bg-white py-3 px-4 border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h5 class="fw-bold mb-0 text-dark">
                <i class="bi bi-person-badge me-2 text-primary"></i>Datos de la Cuenta
            </h5>
            <div>
                <a th:href="@{/cuenta/editar}" class="btn btn-primary btn-sm me-2">
                    <i class="bi bi-pencil-square me-1"></i> Editar Cuenta
                </a>
                <a th:href="@{/cuenta/password}" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-key me-1"></i> Cambiar Contraseña
                </a>
            </div>
        </div>
        <div class="card-body p-4">
            <div class="row mb-3">
                <div class="col-md-3 fw-bold text-secondary">Correo Electrónico:</div>
                <div class="col-md-9 text-dark" th:text="${usuario.email}">correo@example.com</div>
            </div>
            <hr class="text-muted opacity-25">
            <div class="row mb-3">
                <div class="col-md-3 fw-bold text-secondary">Nombre:</div>
                <div class="col-md-9 text-dark" th:text="${usuario.nombre ?: 'No especificado'}">Nombre</div>
            </div>
            <hr class="text-muted opacity-25">
            <div class="row mb-3">
                <div class="col-md-3 fw-bold text-secondary">Fecha de Nacimiento:</div>
                <div class="col-md-9 text-dark" th:text="${usuario.fechaNacimiento != null ? usuario.fechaNacimiento : 'No especificada'}">YYYY-MM-DD</div>
            </div>
            <hr class="text-muted opacity-25">
            <div class="row">
                <div class="col-md-3 fw-bold text-secondary">Descripción / Biografía:</div>
                <div class="col-md-9 text-dark" th:text="${usuario.descripcion ?: 'Sin descripción añadida.'}">Descripción del usuario</div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
