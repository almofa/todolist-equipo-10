<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Detalle del Equipo')"></head>
<body class="bg-light">

<nav th:replace="fragments :: menu"></nav>

<div class="container py-4">
    <!-- Botón para regresar -->
    <div class="mb-3">
        <a th:href="@{/equipos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Volver a equipos
        </a>
    </div>

    <!-- Cabecera del Equipo -->
    <div class="card shadow-sm border rounded-3 mb-4 bg-white">
        <div class="card-body p-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <span class="text-secondary small fw-bold d-block mb-1" th:text="${'EQUIPO ID: #' + equipo.id}">EQUIPO ID: #1</span>
                <h2 class="fw-bold text-dark mb-0" th:text="${equipo.nombre}">Nombre del Equipo</h2>
            </div>
            <div>

            </div>
        </div>
    </div>

    <!-- Tabla de Miembros -->
    <div class="card shadow-sm border rounded-3 bg-white">
        <div class="card-header bg-white py-3 px-4 border-bottom">
            <h5 class="fw-bold mb-0 text-dark">
                <i class="bi bi-people me-2 text-primary"></i>Miembros del Equipo
            </h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive" th:if="${!usuarios.empty}">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4 text-dark" style="width: 15%;">ID Usuario</th>
                        <th class="text-dark">Correo Electrónico</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td class="ps-4 fw-bold text-secondary" th:text="${'#' + usuario.id}">#1</td>
                        <td class="text-dark fw-semibold">
                            <i class="bi bi-envelope me-2 text-primary"></i>
                            <span th:text="${usuario.email}">usuario@example.com</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Si no hay usuarios asignados -->
            <div class="p-4 text-center text-secondary" th:if="${usuarios.empty}">
                <i class="bi bi-person-x fs-2 d-block mb-2 text-secondary"></i>
                <p class="mb-0 fw-semibold">Este equipo aún no tiene miembros asignados.</p>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
