<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Editar Cuenta')"></head>
<body class="bg-light">

<nav th:replace="fragments :: menu"></nav>

<div class="container py-4">
    <!-- Botón para regresar -->
    <div class="mb-3">
        <a th:href="@{/cuenta}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Volver a la cuenta
        </a>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0 mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Formulario de Edición -->
    <div class="card shadow-sm border rounded-3 bg-white">
        <div class="card-header bg-white py-3 px-4 border-bottom">
            <h5 class="fw-bold mb-0 text-dark">
                <i class="bi bi-pencil-square me-2 text-primary"></i>Editar Datos del Perfil
            </h5>
        </div>
        <div class="card-body p-4">
            <form action="#" th:action="@{/cuenta/editar}" th:object="${usuario}" method="post">

                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold text-secondary">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Introduce tu nombre" />
                </div>

                <div class="mb-3">
                    <label for="fechaNacimiento" class="form-label fw-bold text-secondary">Fecha de Nacimiento</label>
                    <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" class="form-control" />
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label fw-bold text-secondary">Descripción / Biografía</label>
                    <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="3" placeholder="Escribe algo sobre ti..."></textarea>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Guardar Cambios
                    </button>
                    <a href="/cuenta" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
