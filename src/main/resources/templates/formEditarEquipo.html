<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Editar Equipo')"></head>
<body>
<div th:replace="fragments :: menu"></div>
<div class="container my-4">
    <h2>Editar Nombre del Equipo</h2>
    <form th:action="@{/equipos/{id}/editar(id=${equipo.id})}" method="post" class="mt-3">
        <div class="form-group">
            <label for="nombre">Nombre del Equipo:</label>
            <input type="text"
                   class="form-control"
                   id="nombre"
                   name="nombre"
                   th:value="${equipo.nombre}"
                   required>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Guardar Cambios</button>
        <a th:href="@{/equipos}" class="btn btn-secondary mt-3">Cancelar</a>
    </form>
</div>
<div th:replace="fragments::javascript"/>
</body>
</html>
