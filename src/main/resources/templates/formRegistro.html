<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Registro de usuario')"></head>

<body class="bg-light">

<div th:replace="fragments :: menu"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0 rounded-lg">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0 font-weight-bold">Registro de Usuario</h4>
                </div>
                <div class="card-body p-4">

                    <!-- Muestra el mensaje de error si el usuario ya existe o si falla la validación -->
                    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}">
                        Error en el registro
                    </div>

                    <form th:action="@{/registro}" th:object="${registroData}" method="post">

                        <div class="form-group mb-3">
                            <label for="email" class="form-label font-weight-bold">Correo electrónico</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="usuario@example.com" required />
                        </div>

                        <div class="form-group mb-3">
                            <label for="nombre" class="form-label font-weight-bold">Nombre completo</label>
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Nombre y Apellidos" />
                        </div>

                        <div class="form-group mb-3">
                            <label for="password" class="form-label font-weight-bold">Contraseña</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control" required />
                        </div>

                        <!-- Selector de fecha corregido con el formato correcto -->
                        <div class="form-group mb-4">
                            <label for="fechaNacimiento" class="form-label font-weight-bold">Fecha de nacimiento</label>
                            <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" class="form-control" max="2026-12-31" />
                        </div>

                        <!-- Opción de Admin si no existen administradores en el sistema -->
                        <div class="form-group mb-4" th:if="${!existenAdmins}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="admin" th:field="*{admin}">
                                <label class="form-check-label font-weight-bold" for="admin">
                                    Registrarse como Administrador
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block font-weight-bold py-2">Registrarse</button>
                    </form>

                </div>
                <div class="card-footer text-center bg-white py-3">
                    <small class="text-muted">¿Ya tienes cuenta? <a th:href="@{/login}" class="text-primary font-weight-bold">Inicia sesión aquí</a></small>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="fragments :: javascript"/>

</body>
</html>
