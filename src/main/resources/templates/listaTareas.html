<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Login')"></head>

<body>
<div th:replace="fragments :: menu"></div>
<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2 th:text="'Listado de tareas de ' + ${usuario.nombre}"></h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                <ul class="nav nav-pills mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${estadoSeleccionado == null or estadoSeleccionado == 'todas'} ? 'active'"
                           th:href="@{/usuarios/{id}/tareas(id=${usuario.id}, estado='todas', prioridad=${prioridadSeleccionada})}"
                           th:text="'Todas (' + ${numTodas} + ')'">Todas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${estadoSeleccionado == 'pendientes'} ? 'active'"
                           th:href="@{/usuarios/{id}/tareas(id=${usuario.id}, estado='pendientes', prioridad=${prioridadSeleccionada})}"
                           th:text="'Pendientes (' + ${numPendientes} + ')'">Pendientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${estadoSeleccionado == 'completadas'} ? 'active'"
                           th:href="@{/usuarios/{id}/tareas(id=${usuario.id}, estado='completadas', prioridad=${prioridadSeleccionada})}"
                           th:text="'Completadas (' + ${numCompletadas} + ')'">Completadas</a>
                    </li>
                </ul>

                <form class="form-inline" method="get" th:action="@{/usuarios/{id}/tareas(id=${usuario.id})}">
                    <input type="hidden" name="estado" th:value="${estadoSeleccionado}" />
                    <label class="mr-2 font-weight-bold" for="filtroPrioridad">Prioridad:</label>
                    <select class="form-control form-control-sm" id="filtroPrioridad" name="prioridad" onchange="this.form.submit()">
                        <option value="TODAS" th:selected="${prioridadSeleccionada == null or prioridadSeleccionada == 'TODAS'}">Todas</option>
                        <option value="ALTA" th:selected="${prioridadSeleccionada == 'ALTA'}">Alta</option>
                        <option value="MEDIA" th:selected="${prioridadSeleccionada == 'MEDIA'}">Media</option>
                        <option value="BAJA" th:selected="${prioridadSeleccionada == 'BAJA'}">Baja</option>
                    </select>
                </form>
            </div>

            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Tarea</th>
                    <th>Prioridad</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tarea: ${tareas}">
                    <td th:text="${tarea.id}"></td>
                    <td>
                        <span th:text="${tarea.titulo}"
                              th:style="${tarea.completada} ? 'text-decoration: line-through; color: #6c757d;' : ''"></span>
                    </td>
                    <td>
                        <span th:if="${tarea.prioridad == 'ALTA'}" class="badge badge-danger">Alta</span>
                        <span th:if="${tarea.prioridad == 'MEDIA' or tarea.prioridad == null}" class="badge badge-warning">Media</span>
                        <span th:if="${tarea.prioridad == 'BAJA'}" class="badge badge-info">Baja</span>
                    </td>
                    <td>
                        <span th:if="${tarea.completada}" class="badge badge-success">Completada</span>
                        <span th:unless="${tarea.completada}" class="badge badge-secondary">Pendiente</span>
                    </td>
                    <td>
                        <form th:action="@{/tareas/{id}/completar(id=${tarea.id})}" method="post" style="display:inline;">
                            <input type="hidden" name="estado" th:value="${estadoSeleccionado}" />
                            <input type="hidden" name="prioridad" th:value="${prioridadSeleccionada}" />
                            <button type="submit"
                                    th:class="${tarea.completada} ? 'btn btn-secondary btn-xs' : 'btn btn-success btn-xs'"
                                    th:text="${tarea.completada} ? 'Reabrir' : 'Completar'"></button>
                        </form>
                        <a class="btn btn-primary btn-xs" th:href="@{/tareas/{id}/editar(id=${tarea.id})}">editar</a>
                        <button class="btn btn-danger btn-xs" onmouseover="" style="cursor: pointer;"
                                th:onclick="'del(\'/tareas/' + ${tarea.id} + '\')'">borrar</button>
                    </td>
                </tr>
                </tbody>
            </table>
            <p><a class="btn btn-primary" th:href="@{/usuarios/{id}/tareas/nueva(id=${usuario.id})}"> Nueva tarea</a>
                <a class="btn btn-link" href="/logout">Salir</a></p>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col">
            <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${!#strings.isEmpty(mensaje)}">
                <span th:text="${mensaje}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        </div>
    </div>
</div>


</div>

<div th:replace="fragments::javascript"/>

<!-- Lanzamos una petición DELETE por JavaScript para borrar una tarea -->

<script type="text/javascript">
    function del(urlBorrar) {
        if (confirm('¿Estás seguro/a de que quieres borrar la tarea?')) {
            fetch(urlBorrar, {
                method: 'DELETE'
            }).then((res) => location.reload());
        }
    }
</script>

</body>
</html>
